<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWellness &#8594; Garmin + Strava Converter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700;900&display=swap');
  :root {
    --bg: #0a0e17; --surface: #111827; --border: #1e293b;
    --accent: #01A9CE; --accent2: #06d6a0; --text: #e2e8f0;
    --muted: #64748b; --danger: #ef4444; --warn: #f59e0b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:2rem; }
  .container { max-width:900px; margin:0 auto; }
  header { display:flex; align-items:center; gap:1rem; margin-bottom:2rem; padding-bottom:1.5rem; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .header-left { display:flex; align-items:center; gap:1rem; flex:1; min-width:0; }
  .logo { width:48px; height:48px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.4rem; color:var(--bg); flex-shrink:0; }
  h1 { font-weight:900; font-size:1.5rem; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  .subtitle { color:var(--muted); font-weight:300; font-size:0.9rem; margin-top:2px; }
  .sdk-badge { display:inline-block; background:rgba(1,169,206,0.12); color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.65rem; padding:2px 6px; border-radius:4px; margin-left:0.5rem; vertical-align:middle; }
  .lang-sel { display:flex; gap:4px; flex-shrink:0; }
  .lang-btn { background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:0.7rem; padding:4px 8px; border-radius:6px; cursor:pointer; transition:all 0.2s; }
  .lang-btn:hover { border-color:var(--accent); color:var(--text); }
  .lang-btn.active { background:rgba(1,169,206,0.15); border-color:var(--accent); color:var(--accent); }
  .drop-zone { border:2px dashed var(--border); border-radius:16px; padding:3rem 2rem; text-align:center; cursor:pointer; transition:all 0.3s; background:var(--surface); }
  .drop-zone:hover,.drop-zone.dragover { border-color:var(--accent); background:rgba(1,169,206,0.05); }
  .drop-zone .icon { font-size:3rem; margin-bottom:1rem; opacity:0.6; }
  .drop-zone p { color:var(--muted); font-size:0.95rem; }
  .drop-zone strong { color:var(--text); }
  input[type="file"] { display:none; }
  .filters { margin-top:1.2rem; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1rem 1.2rem; display:none; }
  .filters.visible { display:block; }
  .filters-title { color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.7rem; }
  .filter-row { display:flex; flex-wrap:wrap; gap:0.8rem; align-items:center; }
  .filter-opt { display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-size:0.85rem; }
  .filter-opt input[type="checkbox"] { accent-color:var(--accent); width:16px; height:16px; cursor:pointer; }
  .filter-hint { color:var(--muted); font-size:0.7rem; font-style:italic; }
  .status { margin-top:1.5rem; font-family:'JetBrains Mono',monospace; font-size:0.8rem; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.2rem; max-height:300px; overflow-y:auto; display:none; }
  .status.visible { display:block; }
  .status .line { padding:2px 0; }
  .status .ok { color:var(--accent2); }
  .status .info { color:var(--accent); }
  .status .warn { color:var(--warn); }
  .status .err { color:var(--danger); }
  .results { margin-top:1.5rem; display:none; }
  .results.visible { display:block; }
  .results-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1rem; margin-bottom:1.5rem; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1rem 1.2rem; }
  .stat-card .label { color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; }
  .stat-card .value { font-size:1.8rem; font-weight:700; margin-top:4px; }
  .stat-card .value.climb { color:var(--accent); }
  .stat-card .value.strength { color:var(--accent2); }
  .stat-card .value.run { color:var(--warn); }
  .download-btn { display:inline-flex; align-items:center; gap:0.6rem; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--bg); border:none; padding:0.9rem 2rem; border-radius:12px; font-family:'Outfit',sans-serif; font-weight:700; font-size:1rem; cursor:pointer; transition:transform 0.2s,box-shadow 0.2s; letter-spacing:-0.01em; }
  .download-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(1,169,206,0.3); }
  .download-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .download-btn.json-btn { background:linear-gradient(135deg,#fc5200,#f59e0b); margin-left:0.6rem; }
  .download-btn.json-btn:hover { box-shadow:0 8px 24px rgba(252,82,0,0.3); }
  .mapping-table { width:100%; margin-top:1.5rem; border-collapse:collapse; font-size:0.85rem; }
  .mapping-table th { text-align:left; color:var(--muted); font-weight:500; padding:0.5rem 0.8rem; border-bottom:1px solid var(--border); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em; }
  .mapping-table td { padding:0.5rem 0.8rem; border-bottom:1px solid rgba(30,41,59,0.5); }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:0.75rem; font-weight:700; font-family:'JetBrains Mono',monospace; }
  .badge.climb { background:rgba(1,169,206,0.15); color:var(--accent); }
  .badge.strength { background:rgba(6,214,160,0.15); color:var(--accent2); }
  .badge.run { background:rgba(245,158,11,0.15); color:var(--warn); }
  .badge.row { background:rgba(139,92,246,0.15); color:#8b5cf6; }
  .badge.cardio { background:rgba(100,116,139,0.15); color:var(--muted); }
  .badge.outdoor { background:rgba(239,68,68,0.12); color:#f87171; }
  .badge.bike { background:rgba(251,191,36,0.15); color:#fbbf24; }
  .badge.elliptical { background:rgba(168,85,247,0.15); color:#a855f7; }
  .footer { margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--border); color:var(--muted); font-size:0.8rem; text-align:center; line-height:1.7; }
  .footer a { color:var(--accent); text-decoration:none; }
  .warning-box { background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.2); border-radius:12px; padding:1rem 1.2rem; margin-top:1rem; font-size:0.85rem; color:var(--warn); }
  .exmap-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
  .exmap-table td { padding:0.4rem 0.6rem; border-bottom:1px solid rgba(30,41,59,0.5); vertical-align:middle; }
  .exmap-table .exname { font-weight:500; }
  .exmap-table .exsum { color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:0.72rem; white-space:nowrap; }
  .exmap-table tr.unmapped .exname { color:var(--warn); }
  .exmap-table select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-family:'Outfit',sans-serif; font-size:0.8rem; cursor:pointer; min-width:170px; }
  .exmap-table select:focus { outline:none; border-color:var(--accent); }
</style>
</head>

<div class="container">

    <div class="header-left">
      <div class="logo">TG</div>

        <h1>MyWellness <span>&#8594;</span> Garmin + Strava <span class="sdk-badge">FIT SDK v21.195</span></h1>

  <div class="drop-zone" id="dropZone">

      <label class="filter-opt"><input type="checkbox" id="fTreadmill" checked> <span class="badge run">Treadmill</span></label>
      <label class="filter-opt"><input type="checkbox" id="fRowing" checked> <span class="badge row">Rowing</span></label>
      <label class="filter-opt"><input type="checkbox" id="fCardio" checked> <span class="badge cardio">Cardio</span></label>
      <label class="filter-opt"><input type="checkbox" id="fOutdoor"> <span class="badge outdoor">Outdoor</span> <span class="filter-hint" id="filterHint"></span></label>
    </div>
  </div>

  <div class="filters" id="exmap"></div>

  <div class="status" id="status"></div>

  <div class="results" id="results">
    <div class="results-grid" id="statsGrid"></div>
    <button class="download-btn" id="downloadBtn" disabled></button>
    <button class="download-btn json-btn" id="downloadJsonBtn" style="display:none"></button>
    <div class="warning-box" id="warningBox"></div>
    <table class="mapping-table" id="mappingTable">
      <thead><tr><th id="thType"></th><th id="thFit"></th><th>Garmin Connect</th><th>Strava</th><th>#</th></tr></thead>
      <tbody id="mappingBody"></tbody>
    </table>
  </div>

  <div class="footer" id="footer"></div>
</div>

let lang = 'en';
function t(key) { return T[lang]?.[key] || T.en[key] || key; }

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));

  document.getElementById('dropTitle').textContent = t('dropTitle');
  document.getElementById('dropSub').textContent = t('dropSub');
  document.getElementById('dropHint').textContent = t('dropHint');

  document.getElementById('filterHint').textContent = t('filterHint');

  document.getElementById('downloadJsonBtn').innerHTML = t('downloadJsonBtn');
  document.getElementById('thType').textContent = t('thType');
  document.getElementById('thFit').textContent = t('thFit');
  document.getElementById('warningBox').innerHTML = `<strong>${t('warningGarmin')}</strong> : ${t('warningGarminDesc')}<br><strong>${t('warningStrava')}</strong> : ${t('warningStravaDesc')}<br><span style="font-size:0.78rem;opacity:0.85">${t('warningNote')}</span>`;
  document.getElementById('footer').innerHTML = `${t('footer')}<br>${t('footerCredit')} | ${t('footerPowered')}`;
  // Update stat cards if visible
  const convertedCard = document.querySelector('[data-stat="converted"]');
  if (convertedCard) convertedCard.querySelector('.label').textContent = t('converted');
  const filteredCard = document.querySelector('[data-stat="filtered"]');
  if (filteredCard) filteredCard.querySelector('.label').textContent = t('filtered');
}

// Init
setLang('en');

<script type="module">
import { Encoder, Profile } from 'https://cdn.jsdelivr.net/npm/@garmin/fitsdk@21.195.0/+esm';

/* ================================================================
   Sport/SubSport classification
   ================================================================ */

function classify(act) {
  const fields = new Set((act.performedData?.pr || []).map(p => p.n));
  const hasSets = (act.performedData?.st || []).length > 0;
  const name = (act.activityName || '').toLowerCase().trim();
  const outdoor = !!act._outdoor;

  // === OUTDOOR activities: check name FIRST (fixes treadmill misclassification bug) ===
  if (outdoor) {
    if (name.includes('run') || name.includes('course') || name.includes('jog'))
      return { sport:'running', subSport:'generic', label:'running', badge:'outdoor', garmin:'Running', strava:'Run', filter:'fOutdoor' };
    if (name.includes('cycl') || name.includes('bik') || name.includes('velo') || name === 'indoor cycling')
      return { sport:'cycling', subSport:'generic', label:'cycling', badge:'outdoor', garmin:'Cycling', strava:'Ride', filter:'fOutdoor' };
    if (name.includes('walk') || name.includes('march'))
      return { sport:'walking', subSport:'generic', label:'walking', badge:'outdoor', garmin:'Walking', strava:'Walk', filter:'fOutdoor' };
    if (name.includes('hik') || name.includes('rando'))
      return { sport:'hiking', subSport:'generic', label:'hiking', badge:'outdoor', garmin:'Hiking', strava:'Hike', filter:'fOutdoor' };
    if (name.includes('swim') || name.includes('nage') || name.includes('zwem'))
      return { sport:'swimming', subSport:'openWater', label:'swimming', badge:'outdoor', garmin:'Open Water Swimming', strava:'Swim', filter:'fOutdoor' };
    if (name.includes('surf'))
      return { sport:'surfing', subSport:'generic', label:'surfing', badge:'outdoor', garmin:'Surfing', strava:'Surf', filter:'fOutdoor' };
    if (name.includes('row'))
      return { sport:'rowing', subSport:'generic', label:'rowing_outdoor', badge:'outdoor', garmin:'Rowing', strava:'Row', filter:'fOutdoor' };
    if (name.includes('yoga'))
      return { sport:'training', subSport:'yoga', label:'yoga', badge:'outdoor', garmin:'Yoga', strava:'Yoga', filter:'fOutdoor' };
    if (name.includes('hiit') || name.includes('hyrox') || name.includes('burn') || name.includes('crossfit'))
      return { sport:'hiit', subSport:'generic', label:'hiit', badge:'outdoor', garmin:'HIIT', strava:'Workout', filter:'fOutdoor' };
    if (name.includes('box'))
      return { sport:'boxing', subSport:'generic', label:'boxing', badge:'outdoor', garmin:'Boxing', strava:'Workout', filter:'fOutdoor' };
    if (name.includes('stair') || name === 'stairstepper')
      return { sport:'fitnessEquipment', subSport:'stairClimbing', label:'stair_climbing', badge:'climb', garmin:'Stair Climbing', strava:'Stair Stepper', filter:'fOutdoor' };
    if (name.includes('pilate'))
      return { sport:'training', subSport:'pilates', label:'pilates', badge:'outdoor', garmin:'Pilates', strava:'Workout', filter:'fOutdoor' };
    return { sport:'training', subSport:'cardioTraining', label:'outdoor_other', badge:'outdoor', garmin:'Cardio', strava:'Workout', filter:'fOutdoor' };
  }

  // === INDOOR activities: classify by equipment field signature ===
  if (fields.has('Floors'))
    return { sport:'fitnessEquipment', subSport:'stairClimbing', label:'stair_climbing', badge:'climb', garmin:'Stair Climbing', strava:'Stair Stepper', filter:'fClimb' };
  // Strength: weighted machines (TotalIsoWeight/Rm1) OR any exercise logged as
  // sets/reps (`st`) — this covers bodyweight moves like push-ups that carry no weight.
  if (fields.has('TotalIsoWeight') || fields.has('Rm1') || hasSets)
    return { sport:'training', subSport:'strengthTraining', label:'strength_training', badge:'strength', garmin:'Strength Training', strava:'Weight Training', filter:'fStrength' };
  if (fields.has('RowingDistance'))
    return { sport:'fitnessEquipment', subSport:'indoorRowing', label:'indoor_rowing', badge:'row', garmin:'Indoor Rowing', strava:'Row', filter:'fRowing' };
  if (fields.has('AvgRpm'))
    return { sport:'cycling', subSport:'indoorCycling', label:'indoor_cycling', badge:'bike', garmin:'Indoor Cycling', strava:'Ride', filter:'fBike' };
  if (fields.has('AvgSpm'))
    return { sport:'fitnessEquipment', subSport:'elliptical', label:'elliptical', badge:'elliptical', garmin:'Elliptical', strava:'Elliptical', filter:'fElliptical' };
  if (fields.has('HDistance') && fields.has('AvgSpeed') && (fields.has('AvgGrade') || fields.has('Elevation')))
    return { sport:'running', subSport:'treadmill', label:'treadmill', badge:'run', garmin:'Treadmill Running', strava:'Run', filter:'fTreadmill' };
  if (fields.has('HDistance') && fields.has('AvgSpeed'))
    return { sport:'cycling', subSport:'indoorCycling', label:'indoor_cycling', badge:'bike', garmin:'Indoor Cycling', strava:'Ride', filter:'fBike' };

  return { sport:'training', subSport:'cardioTraining', label:'cardio', badge:'cardio', garmin:'Cardio', strava:'Workout', filter:'fCardio' };
}

/* ================================================================
   MyWellness helpers
   ================================================================ */

function parseMwDate(s) {
  if (!s) return null;
  return new Date(s.replace(/(\.\d{6})\d+/, '$1'));
}

// Read a value from a MyWellness `pr` (parameter) array — used for both the
// top-level `performedData.pr` aggregates and each set's `st[i].pr`.
function prVal(prArr, name, def = null) {
  const f = (prArr || []).find(p => p.n === name);
  return f ? f.v : def;
}

function getField(act, name, def = null) {
  return prVal(act.performedData?.pr, name, def);
}

// "PUSH_UP_GENERIC" -> "Push Up Generic" for dropdown labels.
function humanizeType(ty) {
  return ty.split('_').map(w => w ? w[0] + w.slice(1).toLowerCase() : w).join(' ');
}
// Pre-built <optgroup> option list for the exercise-type dropdown (static).
const EX_OPTIONS_HTML = STRAVA_GROUPS.map(g =>
  `<optgroup label="${g[1]}">` +
  g[2].map(ty => `<option value="${ty}">${humanizeType(ty)}</option>`).join('') +
  `</optgroup>`).join('');

// phId -> [name, exercise_type] catalog. Nothing is pre-bundled: every exercise
// starts unmapped and you label it once via the dropdown (remembered in
// localStorage). SEED_CATALOG can hold phId -> [name, type] built-in defaults.
const SEED_CATALOG = {};
let catalog = SEED_CATALOG;
const catalogReady = Promise.resolve();

// User overrides (phId -> exercise_type), persisted across sessions.
function loadUserExMap() {
  try { return JSON.parse(localStorage.getItem('mw_exmap_v2') || '{}'); }
  catch { return {}; }
}
let userExMap = loadUserExMap();

// Effective mapping for a phId: user override wins over the catalog.
// Returns { name, type } or null when the phId is unknown and unmapped.
function exFor(phId) {
  if (!phId) return null;
  const userType = userExMap[phId];
  const entry = catalog[phId];              // [name, type] | undefined
  if (userType) return { name: entry ? entry[0] : humanizeType(userType), type: userType };
  if (entry) return { name: entry[0], type: entry[1] };
  return null;
}
function setUserEx(phId, type) {
  if (!type) delete userExMap[phId];
  else userExMap[phId] = type;
  try { localStorage.setItem('mw_exmap_v2', JSON.stringify(userExMap)); } catch {}
}

// Strava exercise_type for a phId (always valid for the JSON upload).
function stravaExerciseType(phId) {
  const ex = exFor(phId);
  return (ex && ex.type) || STRAVA_FALLBACK;
}
// FIT exercise_category for a phId, or null when truly unmapped (FIT
// categories are optional, so an unknown exercise is a generic set).
function fitCategoryFor(phId) {
  const ex = exFor(phId);
  return ex && ex.type != null ? (STRAVA_TO_CAT[ex.type] ?? null) : null;
}

// Local UTC offset (seconds) parsed from a MyWellness timestamp's "+02:00" tail.
function utcOffsetSeconds(onStr) {
  const m = /([+-])(\d{2}):(\d{2})$/.exec(onStr || '');
  return m ? (m[1] === '-' ? -1 : 1) * (parseInt(m[2], 10) * 3600 + parseInt(m[3], 10) * 60) : 0;
}

/* ================================================================
   FIT Activity builder
   ================================================================ */

const RECORD_INTERVAL_SEC = 60;
// Consecutive strength exercises started within this gap belong to one training
// session and are combined into a single FIT file.
const SESSION_GAP_SEC = 90 * 60;

function buildFitActivity(startDt, durationSec, calories, avgHr, maxHr, sport, subSport, avgPower, distanceM) {
  const encoder = new Encoder();
  const endDt = new Date(startDt.getTime() + durationSec * 1000);
  const cal = Math.floor(calories || 0);
  const dist = distanceM || 0;
  const hH = avgHr && avgHr > 0;
  const hM = maxHr && maxHr > 0;
  const hP = avgPower && avgPower > 0;

  encoder.onMesg(Profile.MesgNum.FILE_ID, { type: 'activity', manufacturer: 'development', product: 1, timeCreated: startDt });
  encoder.onMesg(Profile.MesgNum.SPORT, { sport, subSport });
  encoder.onMesg(Profile.MesgNum.EVENT, { timestamp: startDt, event: 'timer', eventType: 'start' });

  const safeDuration = Math.max(durationSec, 1);
  const numRecords = Math.max(Math.floor(safeDuration / RECORD_INTERVAL_SEC), 1);
  const actualInterval = safeDuration / numRecords;

  for (let i = 0; i <= numRecords; i++) {
    const elapsed = Math.min(i * actualInterval, safeDuration);
    const frac = elapsed / safeDuration;
    const ts = new Date(startDt.getTime() + elapsed * 1000);
    const rec = { timestamp: ts, distance: dist * frac };
    if (hH) {
      const hrVariation = Math.min(5, avgHr * 0.03);
      const sinFrac = Math.sin(frac * Math.PI);
      rec.heartRate = Math.floor(avgHr - hrVariation + 2 * hrVariation * sinFrac);
    }
    if (hP) rec.power = Math.floor(avgPower);
    encoder.onMesg(Profile.MesgNum.RECORD, rec);
  }

  encoder.onMesg(Profile.MesgNum.EVENT, { timestamp: endDt, event: 'timer', eventType: 'stopAll' });

  const lap = { timestamp: endDt, startTime: startDt, totalElapsedTime: durationSec, totalTimerTime: durationSec, totalCalories: cal, sport, subSport };
  if (hH) lap.avgHeartRate = Math.floor(avgHr);
  if (hM) lap.maxHeartRate = Math.floor(maxHr);
  if (hP) lap.avgPower = Math.floor(avgPower);
  if (dist > 0) lap.totalDistance = dist;
  encoder.onMesg(Profile.MesgNum.LAP, lap);

  const session = { timestamp: endDt, startTime: startDt, totalElapsedTime: durationSec, totalTimerTime: durationSec, totalCalories: cal, sport, subSport, firstLapIndex: 0, numLaps: 1, trigger: 'activityEnd' };
  if (hH) session.avgHeartRate = Math.floor(avgHr);
  if (hM) session.maxHeartRate = Math.floor(maxHr);
  if (hP) session.avgPower = Math.floor(avgPower);
  if (dist > 0) session.totalDistance = dist;
  encoder.onMesg(Profile.MesgNum.SESSION, session);

  encoder.onMesg(Profile.MesgNum.ACTIVITY, { timestamp: endDt, totalTimerTime: durationSec, numSessions: 1, type: 'manual' });

  return encoder.close();
}

/* ================================================================
   Strength session builder — combines several MyWellness exercise
   entries (each an exercise with its sets) into ONE FIT strength
   activity: one lap per exercise, every set as a FIT SET message.
   ================================================================ */
function buildStrengthSession(entries) {
  const sport = 'training', subSport = 'strengthTraining';
  const parts = entries.map(act => ({
    startDt: parseMwDate(act.on),
    dur: Math.max(getField(act, 'Duration', 0) || 0, 0),
    cal: getField(act, 'Calories', 0) || 0,
    avgHr: getField(act, 'AvgHr'),
    maxHr: getField(act, 'MaxHr'),
    sets: act.performedData?.st || [],
    cat: fitCategoryFor(act.phId),
  })).filter(p => p.startDt && !isNaN(p.startDt.getTime()));
  if (!parts.length) throw new Error('empty strength session');

  const encoder = new Encoder();
  const sessionStart = parts[0].startDt;
  encoder.onMesg(Profile.MesgNum.FILE_ID, { type: 'activity', manufacturer: 'development', product: 1, timeCreated: sessionStart });
  encoder.onMesg(Profile.MesgNum.SPORT, { sport, subSport });
  encoder.onMesg(Profile.MesgNum.EVENT, { timestamp: sessionStart, event: 'timer', eventType: 'start' });

  let mi = 0, lapIndex = 0, sessionEndMs = sessionStart.getTime();
  let totalCal = 0, totalTimer = 0, hrWeighted = 0, hrDur = 0, maxHrAll = 0;

  for (const p of parts) {
    const exStartMs = p.startDt.getTime();
    const hasHr = p.avgHr && p.avgHr > 0;
    const dur = Math.max(p.dur, 1);

    // Light HR trace across the exercise's active time.
    const nRec = Math.max(Math.floor(dur / RECORD_INTERVAL_SEC), 1);
    for (let i = 0; i <= nRec; i++) {
      const elapsed = Math.min((i * dur) / nRec, dur);
      const rec = { timestamp: new Date(exStartMs + elapsed * 1000) };
      if (hasHr) {
        const v = Math.min(5, p.avgHr * 0.03);
        rec.heartRate = Math.floor(p.avgHr - v + 2 * v * Math.sin((elapsed / dur) * Math.PI));
      }
      encoder.onMesg(Profile.MesgNum.RECORD, rec);
    }

    // One SET message per performed set (+ a rest set).
    let cursor = exStartMs;
    for (const s of p.sets) {
      const reps = prVal(s.pr, 'IsoReps');
      const wt = prVal(s.pr, 'IsoWeight');
      const sDur = Math.max(prVal(s.pr, 'Duration', 0) || 0, 1);
      const rest = prVal(s.pr, 'RestTime', 0) || 0;
      const active = { messageIndex: mi++, timestamp: new Date(cursor + sDur * 1000), startTime: new Date(cursor), setType: 'active', duration: sDur };
      if (reps != null) active.repetitions = Math.round(reps);
      if (wt != null && wt > 0) { active.weight = wt; active.weightDisplayUnit = 'kilogram'; }
      if (p.cat != null) active.category = [p.cat];
      encoder.onMesg(Profile.MesgNum.SET, active);
      cursor += sDur * 1000;
      if (rest > 0) {
        encoder.onMesg(Profile.MesgNum.SET, { messageIndex: mi++, timestamp: new Date(cursor + rest * 1000), startTime: new Date(cursor), setType: 'rest', duration: rest });
        cursor += rest * 1000;
      }
    }

    const exEndMs = Math.max(cursor, exStartMs + dur * 1000);
    const lap = { messageIndex: lapIndex++, startTime: p.startDt, timestamp: new Date(exEndMs), totalElapsedTime: (exEndMs - exStartMs) / 1000, totalTimerTime: p.dur, totalCalories: Math.floor(p.cal), sport, subSport };
    if (hasHr) lap.avgHeartRate = Math.floor(p.avgHr);
    if (p.maxHr && p.maxHr > 0) lap.maxHeartRate = Math.floor(p.maxHr);
    encoder.onMesg(Profile.MesgNum.LAP, lap);

    sessionEndMs = Math.max(sessionEndMs, exEndMs);
    totalCal += p.cal; totalTimer += p.dur;
    if (hasHr) { hrWeighted += p.avgHr * dur; hrDur += dur; }
    if (p.maxHr) maxHrAll = Math.max(maxHrAll, p.maxHr);
  }

  const sessionEnd = new Date(sessionEndMs);
  encoder.onMesg(Profile.MesgNum.EVENT, { timestamp: sessionEnd, event: 'timer', eventType: 'stopAll' });

  const session = { messageIndex: 0, startTime: sessionStart, timestamp: sessionEnd, totalElapsedTime: (sessionEndMs - sessionStart.getTime()) / 1000, totalTimerTime: totalTimer, totalCalories: Math.floor(totalCal), sport, subSport, firstLapIndex: 0, numLaps: lapIndex, trigger: 'activityEnd' };
  if (hrDur > 0) session.avgHeartRate = Math.floor(hrWeighted / hrDur);
  if (maxHrAll > 0) session.maxHeartRate = Math.floor(maxHrAll);
  encoder.onMesg(Profile.MesgNum.SESSION, session);
  encoder.onMesg(Profile.MesgNum.ACTIVITY, { timestamp: sessionEnd, totalTimerTime: totalTimer, numSessions: 1, type: 'manual' });

  return encoder.close();
}

/* ================================================================
   Strava strength-training JSON builder (data_type=json upload).
   Format: https://developers.strava.com/docs/uploads/
   One object per training session; each performed set becomes a
   `sets[]` entry with a Strava exercise_type, reps, weight (kg).
   ================================================================ */
function buildStrengthJson(entries) {
  const parts = entries.map(act => ({
    on: act.on,
    startDt: parseMwDate(act.on),
    dur: Math.max(getField(act, 'Duration', 0) || 0, 0),
    cal: getField(act, 'Calories', 0) || 0,
    sets: act.performedData?.st || [],
    type: stravaExerciseType(act.phId),
  })).filter(p => p.startDt && !isNaN(p.startDt.getTime()));
  if (!parts.length) throw new Error('empty strength session');

  const sessionStart = parts[0].startDt;
  let sessionEndMs = sessionStart.getTime(), totalCal = 0, activeTime = 0;
  const jsonSets = [];

  for (const p of parts) {
    // Spread this exercise's sets evenly across its own logged duration so set
    // timestamps stay within the exercise window (MyWellness exercise durations
    // overlap on the real timeline, so accumulating work+rest would overshoot).
    const n = p.sets.length || 1;
    p.sets.forEach((s, i) => {
      const reps = prVal(s.pr, 'IsoReps');
      const wt = prVal(s.pr, 'IsoWeight');
      const sDur = Math.max(prVal(s.pr, 'Duration', 0) || 0, 1);
      const setStart = p.startDt.getTime() + (i * p.dur / n) * 1000;
      const set = { exercise_type: p.type, start_time: new Date(setStart).toISOString() };
      if (reps != null) set.repetitions = Math.round(reps);
      else set.duration = Math.round(sDur);   // timed set (holds, e.g. planks)
      if (wt != null && wt > 0) set.weight = wt;
      jsonSets.push(set);
    });
    activeTime += p.dur;
    totalCal += p.cal;
    sessionEndMs = Math.max(sessionEndMs, p.startDt.getTime() + p.dur * 1000);
  }

  const elapsed = Math.round((sessionEndMs - sessionStart.getTime()) / 1000);
  return {
    version: '1.0',
    start_time: sessionStart.toISOString(),
    utc_offset: utcOffsetSeconds(parts[0].on),
    elapsed_time: elapsed,
    active_time: Math.min(Math.round(activeTime), elapsed),
    total_calories: Math.round(totalCal),
    creator: { name: 'MyWellness (Technogym)' },
    sets: jsonSets,
  };
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const downloadBtn = document.getElementById('downloadBtn');
const downloadJsonBtn = document.getElementById('downloadJsonBtn');
const filtersEl = document.getElementById('filters');
let allActivities = [], outputZip = null, strengthSessions = [];

function log(m, c = 'info') {
  statusEl.classList.add('visible');
  statusEl.innerHTML += `<div class="line ${c}">${m}</div>`;
  statusEl.scrollTop = statusEl.scrollHeight;
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });
document.querySelectorAll('.filters input').forEach(cb => cb.addEventListener('change', () => { if (allActivities.length) convert(allActivities); }));

async function processFile(file) {
  statusEl.innerHTML = ''; resultsEl.classList.remove('visible'); filtersEl.classList.remove('visible');
  downloadBtn.disabled = true; outputZip = null; allActivities = [];
  log(`${t('logFile')}: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
  let activities = [];

  if (file.name.endsWith('.zip')) {
    try {
      const zip = await JSZip.loadAsync(file);
      const all = Object.keys(zip.files).filter(f => !zip.files[f].dir);
      log(`${t('logZipContains')} ${all.length} ${t('logFiles')}`);
      const jsons = all.filter(f => f.endsWith('.json'));
      if (!jsons.length) { log(t('logNoJson'), 'err'); return; }
      for (const fn of jsons) {
        const txt = await zip.files[fn].async('string');
        const short = fn.split('/').pop().replace(/-[0-9a-f-]{36}/g, '...');
        try {
          const d = JSON.parse(txt);
          if (!Array.isArray(d) || !d.length) { log(`  ${short}: ${t('logEmpty')}`, 'warn'); continue; }
          if (d[0].name && d[0].measuredOn) { log(`  ${short}: ${t('logBiometrics')}`, 'warn'); continue; }
          if (d[0].on && d[0].performedData) { activities = activities.concat(d); log(`  ${short}: ${d.length} ${t('logIndoor')}`, 'ok'); continue; }
          if (d[0].performedDate && d[0].physicalActivityData) {
            activities = activities.concat(d.map(a => ({ ...a, on: a.performedDate, performedData: a.physicalActivityData, _outdoor: true })));
            log(`  ${short}: ${d.length} ${t('logOutdoor')}`, 'ok'); continue;
          }
          log(`  ${short}: ${t('logUnknownSchema')}`, 'warn');
        } catch (e) { log(`  ${short}: ${t('logJsonInvalid')}`, 'err'); }
      }
    } catch (e) { log(`${t('logZipError')}: ${e.message}`, 'err'); return; }
  } else if (file.name.endsWith('.json')) {
    try { const d = JSON.parse(await file.text()); activities = Array.isArray(d) ? d : [d]; log(`JSON: ${activities.length} ${t('logEntries')}`, 'ok'); }
    catch (e) { log(`${t('logJsonError')}: ${e.message}`, 'err'); return; }
  } else { log(t('logUnsupported'), 'err'); return; }

  if (!activities.length) { log(t('logNoActivity'), 'warn'); return; }
  allActivities = activities;
  filtersEl.classList.add('visible');
  await catalogReady;   // ensure the phId->exercise catalog is loaded first
  convert(activities);
}

// Human-readable summary of a strength entry's sets, e.g. "10/10/10 reps @ 30kg".
function setSummary(sets) {
  if (!sets || !sets.length) return '';
  const reps = sets.map(s => prVal(s.pr, 'IsoReps')).filter(v => v != null);
  const wts = sets.map(s => prVal(s.pr, 'IsoWeight')).filter(v => v != null && v > 0);
  const repStr = reps.length ? `${reps.map(r => Math.round(r)).join('/')} reps` : `${sets.length} set${sets.length > 1 ? 's' : ''}`;
  return repStr + (wts.length ? ` @ ${Math.max(...wts)}kg` : '');
}

// Render the phId -> exercise-type mapping UI. Each distinct strength exercise
// gets a dropdown of Strava exercise types; the choice is saved and re-applied.
function renderExerciseMap(strengthPh) {
  const el = document.getElementById('exmap');
  const ids = Object.keys(strengthPh);
  if (!ids.length) { el.classList.remove('visible'); el.innerHTML = ''; return; }
  const rows = ids.map(id => {
    const info = strengthPh[id];
    const ex = exFor(id);
    const mapped = !!(ex && ex.type);
    const cur = mapped ? ex.type : '';
    const nm = ex ? ex.name : 'Unknown exercise';
    return `<tr class="exrow${mapped ? '' : ' unmapped'}">
      <td class="exname">${nm}</td>
      <td class="exsum">${info.summary || ''}${info.count > 1 ? ` · ${info.count}×` : ''}</td>
      <td><select data-phid="${id}" data-cur="${cur}"><option value="">— unmapped —</option>${EX_OPTIONS_HTML}</select></td>
    </tr>`;
  }).join('');
  el.innerHTML = `<div class="filters-title">${t('exmapTitle')}</div>
    <div class="filter-hint" style="margin-bottom:0.7rem">${t('exmapHint')}</div>
    <table class="exmap-table"><tbody>${rows}</tbody></table>`;
  el.classList.add('visible');
  el.querySelectorAll('select[data-phid]').forEach(sel => {
    sel.value = sel.dataset.cur;
    sel.addEventListener('change', () => {
      setUserEx(sel.dataset.phid, sel.value || null);
      convert(allActivities);
    });
  });
}

function convert(activities) {
  resultsEl.classList.remove('visible'); downloadBtn.disabled = true;
  outputZip = new JSZip();
  const stats = {}; let converted = 0, filtered = 0, errors = 0; const notes = [];
  const strengthPh = {};      // phId -> { count, summary } — drives the mapping UI
  const strengthEntries = []; // { act, c, startDt } — grouped into sessions below

  // Record one exercise occurrence for the stats cards + mapping table.
  function tallyExercise(act, c) {
    const ex = exFor(act.phId);
    const label = ex ? ex.name : 'Strength (unmapped)';
    if (act.phId) {
      strengthPh[act.phId] = strengthPh[act.phId] || { count: 0, summary: setSummary(act.performedData?.st || []) };
      strengthPh[act.phId].count++;
    }
    stats[label] = stats[label] || { count: 0, badge: c.badge, garmin: ex ? ex.name : c.garmin, strava: c.strava, sport: c.sport, subSport: c.subSport };
    stats[label].count++;
  }

  // Pass 1: emit one file per non-strength activity; collect strength entries.
  for (const act of activities) {
    try {
      if (!act.on) { errors++; continue; }
      const c = classify(act);
      const cb = document.getElementById(c.filter);
      if (cb && !cb.checked) { filtered++; continue; }
      const startDt = parseMwDate(act.on);
      if (!startDt || isNaN(startDt.getTime())) { errors++; continue; }

      if (c.subSport === 'strengthTraining') { strengthEntries.push({ act, c, startDt }); continue; }

      const dur = getField(act, 'Duration', 0);
      const cal = getField(act, 'Calories', 0);
      const avgHr = getField(act, 'AvgHr');
      const maxHr = getField(act, 'MaxHr');
      const avgPwr = getField(act, 'AvgPower');
      const dist = getField(act, 'HDistance', 0);

      const fitBytes = buildFitActivity(startDt, dur, cal, avgHr, maxHr, c.sport, c.subSport, avgPwr, dist);
      const dtStr = act.on.substring(0, 19).replace(/:/g, '-').replace('T', '_');
      outputZip.file(`${dtStr}_${c.label}.fit`, fitBytes);
      stats[c.label] = stats[c.label] || { count: 0, badge: c.badge, garmin: c.garmin, strava: c.strava, sport: c.sport, subSport: c.subSport };
      stats[c.label].count++;

      const np = [`Technogym ${c.garmin}`];
      const fl = getField(act, 'Floors'); if (fl) np.push(`Floors: ${Math.floor(fl)}`);
      if (avgPwr) np.push(`Power: ${Math.floor(avgPwr)}W`);
      const lv = getField(act, 'Level'); if (lv) np.push(`Level: ${lv.toFixed(1)}`);
      const vo = getField(act, 'Vo2'); if (vo) np.push(`VO2: ${vo.toFixed(1)}`);
      if (dist > 0) np.push(`Dist: ${(dist / 1000).toFixed(2)}km`);
      notes.push(`${dtStr}_${c.label}.fit | ${np.join(' | ')}`);
      converted++;
    } catch (e) { errors++; log(`  Err: ${act.on} - ${e.message}`, 'err'); }
  }

  // Pass 2: group strength entries into training sessions by start-time
  // proximity, then emit ONE combined FIT file per session.
  strengthEntries.sort((a, b) => a.startDt - b.startDt);
  const sessions = [];
  for (const e of strengthEntries) {
    const cur = sessions[sessions.length - 1];
    const last = cur && cur[cur.length - 1];
    if (!cur || (e.startDt - last.startDt) / 1000 > SESSION_GAP_SEC) sessions.push([e]);
    else cur.push(e);
  }

  strengthSessions = sessions.map(sess => sess.map(e => e.act));

  for (const sess of sessions) {
    try {
      for (const { act, c } of sess) tallyExercise(act, c);
      const fitBytes = buildStrengthSession(sess.map(e => e.act));
      const dtStr = sess[0].act.on.substring(0, 19).replace(/:/g, '-').replace('T', '_');
      const fname = `${dtStr}_strength.fit`;
      outputZip.file(fname, fitBytes);
      const detail = sess.map(e => {
        const ex = exFor(e.act.phId);
        return `${ex ? ex.name : 'Unknown'} (${setSummary(e.act.performedData?.st || [])})`;
      });
      notes.push(`${fname} | Strength session, ${sess.length} exercise${sess.length > 1 ? 's' : ''} | ${detail.join(' | ')}`);
      converted++;
    } catch (e) { errors++; log(`  Err: strength session - ${e.message}`, 'err'); }
  }

  renderExerciseMap(strengthPh);
  outputZip.file('_notes_technogym.txt', notes.join('\n'));
  const sessMsg = sessions.length ? ` · ${sessions.length} strength session${sessions.length > 1 ? 's' : ''}` : '';
  log(`\n${converted} ${t('logConverted')}${sessMsg}, ${filtered} ${t('logFiltered')}, ${errors} ${t('logErrors')}`, converted > 0 ? 'ok' : 'err');

  const grid = document.getElementById('statsGrid'); grid.innerHTML = '';
  const tc = document.createElement('div'); tc.className = 'stat-card'; tc.dataset.stat = 'converted';
  tc.innerHTML = `<div class="label">${t('converted')}</div><div class="value">${converted}</div>`; grid.appendChild(tc);
  if (filtered > 0) {
    const fc = document.createElement('div'); fc.className = 'stat-card'; fc.dataset.stat = 'filtered';
    fc.innerHTML = `<div class="label">${t('filtered')}</div><div class="value" style="color:var(--muted)">${filtered}</div>`; grid.appendChild(fc);
  }
  for (const [l, s] of Object.entries(stats).sort((a, b) => b[1].count - a[1].count)) {
    const cd = document.createElement('div'); cd.className = 'stat-card';
    cd.innerHTML = `<div class="label">${s.garmin}</div><div class="value ${s.badge}">${s.count}</div>`; grid.appendChild(cd);
  }

  const tb = document.getElementById('mappingBody'); tb.innerHTML = '';
  for (const [l, s] of Object.entries(stats).sort((a, b) => b[1].count - a[1].count)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span class="badge ${s.badge}">${l}</span></td><td style="font-family:'JetBrains Mono';font-size:0.8rem">${s.sport} / ${s.subSport}</td><td>${s.garmin}</td><td>${s.strava}</td><td style="font-weight:700">${s.count}</td>`;
    tb.appendChild(tr);
  }
  resultsEl.classList.add('visible');
  downloadBtn.disabled = converted === 0;
  downloadJsonBtn.style.display = strengthSessions.length ? 'inline-flex' : 'none';
}

downloadBtn.addEventListener('click', async () => {
  if (!outputZip) return;
  downloadBtn.disabled = true; downloadBtn.textContent = t('generating');
  const blob = await outputZip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  downloadBlob(blob, `mywellness_garmin_fit_${new Date().toISOString().slice(0, 10)}.zip`);
  downloadBtn.disabled = false; downloadBtn.innerHTML = t('downloadBtn');
  log('\n' + t('logDownloaded'), 'ok');
});

// Strava strength-training JSON: one file per session (zipped if several).
downloadJsonBtn.addEventListener('click', async () => {
  if (!strengthSessions.length) return;
  const files = strengthSessions.map(entries => {
    const dt = entries[0].on.substring(0, 19).replace(/:/g, '-').replace('T', '_');
    return { name: `${dt}_strength.json`, text: JSON.stringify(buildStrengthJson(entries), null, 2) };
  });
  if (files.length === 1) {
    downloadBlob(new Blob([files[0].text], { type: 'application/json' }), files[0].name);
  } else {
    const zip = new JSZip();
    for (const f of files) zip.file(f.name, f.text);
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    downloadBlob(blob, `mywellness_strava_strength_json_${new Date().toISOString().slice(0, 10)}.zip`);
  }
  log('\n' + t('logJsonDownloaded'), 'ok');
});
</script>
